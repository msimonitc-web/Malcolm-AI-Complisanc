    <script>
      // Filter benign Vite HMR websocket reconnection notices in sandboxed iframe environment
      (function() {
        if (typeof window !== 'undefined' && window.WebSocket) {
          var RealWebSocket = window.WebSocket;
          window.WebSocket = function(url, protocols) {
            var protoStr = Array.isArray(protocols) ? protocols.join(' ') : String(protocols || '');
            var urlStr = String(url || '');
            if (protoStr.indexOf('vite') !== -1 || urlStr.indexOf('token=') !== -1) {
              var dummy = {
                readyState: 3,
                close: function() {},
                send: function() {},
                addEventListener: function() {},
                removeEventListener: function() {},
                dispatchEvent: function() { return false; },
                set onopen(fn) {},
                set onclose(fn) {},
                set onerror(fn) {},
                set onmessage(fn) {}
              };
              return dummy;
            }
            return new RealWebSocket(url, protocols);
          };
          window.WebSocket.prototype = RealWebSocket.prototype;
          window.WebSocket.CONNECTING = 0;
          window.WebSocket.OPEN = 1;
          window.WebSocket.CLOSING = 2;
          window.WebSocket.CLOSED = 3;
        }

        var methods = ['error', 'warn', 'log', 'info', 'debug'];
        function isVite(arg) {
          if (!arg) return false;
          var str = typeof arg === 'string' ? arg : (arg.message || String(arg));
          return str.indexOf('[vite]') !== -1 || str.indexOf('vite-hmr') !== -1 || str.indexOf('failed to connect to websocket') !== -1;
        }
        methods.forEach(function(m) {
          var orig = console[m];
          if (!orig) return;
          console[m] = function() {
            for (var i = 0; i < arguments.length; i++) {
              if (isVite(arguments[i])) return;
            }
            return orig.apply(console, arguments);
          };
        });
        window.addEventListener('error', function(e) {
          if (e && (isVite(e.message) || (e.filename && e.filename.indexOf('@vite') !== -1))) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          if (e && isVite(e.reason)) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
      })();
    </script>
